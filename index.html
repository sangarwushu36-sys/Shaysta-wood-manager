<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Shaysta Wood Manager — إدارة ورشة النجارة</title>
<meta name="description" content="تطبيق لإدارة ورشة النجارة: المبيعات، المشتريات، العملاء، المخزون، التقارير والنسخ الاحتياطي — يعمل بدون إنترنت." />
<meta name="theme-color" content="#2b211b" />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Shaysta Wood" />
<meta name="mobile-web-app-capable" content="yes" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ======================= شريط علوي (موبايل) ======================= -->
<header class="topbar">
  <button class="icon-btn" id="menuToggle" aria-label="فتح القائمة">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="topbar-title">
    <img class="brand-mark" src="icons/logo-96.png" alt="شعار Shaysta" />
    <span id="topbarPageTitle">لوحة التحكم</span>
  </div>
  <span class="offline-pill" id="offlinePill" hidden>غير متصل</span>
</header>

<div class="app-shell">

  <!-- ======================= الشريط الجانبي ======================= -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img class="brand-mark" src="icons/logo-96.png" alt="شعار Shaysta" />
      <div class="brand-text">
        <strong>Shaysta</strong>
        <span>Wood Manager</span>
      </div>
    </div>

    <nav class="nav" id="mainNav">
      <button class="nav-item is-active" data-page="dashboard">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6V11h-6v9Zm0-16v5h6V4h-6Z" fill="currentColor"/></svg>
        <span>لوحة التحكم</span>
      </button>
      <button class="nav-item" data-page="sales">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 3h2l1.6 9.6A2 2 0 0 0 8.57 14.5H18a2 2 0 0 0 1.97-1.67L21.3 6H6.2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="18" cy="20" r="1.4" fill="currentColor"/></svg>
        <span>المبيعات</span>
      </button>
      <button class="nav-item" data-page="purchases">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 4h16l-1.5 12.5a2 2 0 0 1-2 1.5H7.5a2 2 0 0 1-2-1.5L4 4Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M8 4V3a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <span>المشتريات</span>
      </button>
      <button class="nav-item" data-page="customers">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <span>العملاء</span>
      </button>
      <button class="nav-item" data-page="inventory">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M3 7.5V16l9 4.5 9-4.5V7.5M12 12v8.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
        <span>المخزون</span>
      </button>
      <button class="nav-item" data-page="reports">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <span>التقارير</span>
      </button>
      <button class="nav-item" data-page="backup">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3v10m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <span>النسخ الاحتياطي</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="install-btn" id="installBtn" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 4v10m0 0 3.5-3.5M12 14 8.5 10.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <span>تثبيت التطبيق</span>
      </button>
      <p class="version-tag">الإصدار 1.0 — يعمل بدون إنترنت</p>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ======================= المحتوى الرئيسي ======================= -->
  <main class="content" id="pageContent">
    <!-- سيتم حقن الصفحات هنا عبر app.js -->
  </main>
</div>

<!-- ======================= طبقة النوافذ المنبثقة (Modal) ======================= -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3 id="modalTitle">عنوان</h3>
      <button class="icon-btn" id="modalClose" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- شريط تنبيه صغير (Toast) -->
<div class="toast" id="toast"></div>

<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
